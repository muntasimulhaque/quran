[versions]
agp = "9.3.0"
kotlin = "2.4.10"
junit = "4.13.2"
serializationJson = "1.11.0"
sqliteJdbc = "3.49.1.0"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# The sheet's own physics, and where this pin stands now.
#
# Material3 1.4.0, which the BOM still carries, settled a dragged sheet with
# an underdamped spring that was allowed to pass its anchor, and an update to
# the content's height mid-settle restarted it with the finger's velocity, so
# a sheet could bounce at the top instead of resting. 1.5.0-alpha16 fixed the
# root: the settle bounds the fling velocity and clamps every step between the
# anchors. The app shipped against the newest beta while the 1.5.0 line was
# still moving; 1.5.0 is stable now, so the pin names the stable release
# (owner decision, 21.3).
#
# The pin stays a pin, and not a BOM move, for one measured reason: the newest
# BOM (2026.11.01) also carries Compose 1.13.0, whose AAR metadata requires
# compileSdk 37.1. This app compiles against android-37.0, which is the
# platform it targets and the one its CI image installs, so the BOM move waits
# for the session that raises compileSdk to 37.1 and proves that platform on
# every leg. Until then this one line keeps the sheet's physics on stable
# 1.5.0 while everything else stays on the BOM's 1.12.1.
material3 = "1.5.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
media3 = "1.11.1"
testExtJunit = "1.2.1"
testRunner = "1.6.2"
espressoCore = "3.7.0"
# Test only: the Google Accessibility Test Framework, which the app's own
# instrumented accessibility test runs over the main surfaces. It never
# ships and nothing in the bundle depends on it.
accessibilityTestFramework = "4.1.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
accessibility-test-framework = { group = "com.google.android.apps.common.testing.accessibility.framework", name = "accessibility-test-framework", version.ref = "accessibilityTestFramework" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
