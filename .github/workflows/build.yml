name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: Gates and debug build
    runs-on: ubuntu-latest
    env:
      # Lets the fetch tool fall back to the GitHub CLI if the release CDN
      # host is unreachable.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # The action's default 'tools' package no longer exists in the SDK
          # repository; platform-tools is all this build needs from it.
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # The font pack is fetched from the project's own Release; caching it
      # keeps repeat runs fast.
      - name: Cache content work
        uses: actions/cache@v4
        with:
          path: |
            content/work
            content/quran.db
          key: content-work-${{ hashFiles('content/manifest.json', 'content/build-report.json') }}

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Fetch content
        run: ./gradlew :tools:run --args="fetch" --console=plain

      - name: Database check
        run: ./gradlew :tools:run --args="checkdb" --console=plain

      - name: Search check
        run: ./gradlew :tools:run --args="search" --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# verify, audit, and fonts are owner-machine gates: they need the raw QUL and
# QuranEnc exports, which are not in the repository. Run them locally with
# ./gradlew :tools:run --args="verify|audit|fonts" before a release.

  # The screenshots job runs the app on a real Android system and photographs
  # every reading surface. Its artifacts are how a change is reviewed without
  # a device in hand.
  screenshots:
    name: Screenshots and instrumented tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache content work
        uses: actions/cache@v4
        with:
          path: |
            content/work
            content/quran.db
          key: content-work-${{ hashFiles('content/manifest.json', 'content/build-report.json') }}

      # Hardware acceleration is not available on the runners, so the emulator
      # runs on the software renderer. It is slow, and it still renders every
      # pixel the reader would see.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --console=plain

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-screenshots
          path: app/build/outputs/connected_android_test_additional_output/**/*.png
          if-no-files-found: warn
