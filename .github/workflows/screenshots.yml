name: Capture store screenshots

# Renders real Play Store screenshots from the app's own Compose UI on an
# Android emulator, for all three form factors Play asks for: phone, 7 inch
# tablet, and 10 inch tablet. Trigger manually, or automatically when the UI
# or the capture test changes.
#
# The emulator is cold and software rendered, which is the slowest Android
# this app will ever run on, so the AVD and its snapshot are cached per form
# factor: only the first run of a form factor pays for creating the machine,
# and every run after it boots from the snapshot. The boot wait before the
# test is not a fixed sleep: a cold boot can report completion before its
# emulated storage is mounted, and the test's output directory breaks if the
# test starts first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Play Store form factors.
        include:
          - name: phone
            profile: pixel_2        # 1080x1920
          - name: tablet7
            profile: Nexus 7        # 1200x1920, 7 inch
          - name: tablet10
            profile: pixel_c        # 2560x1800, 10 inch
    env:
      GH_TOKEN: ${{ github.token }}
      API_LEVEL: "35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache content
        uses: actions/cache@v4
        with:
          path: |
            content/work
            content/quran.db
            content/packs
          key: content-work-${{ hashFiles('content/manifest.json', 'content/build-report.json') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD and its snapshot are expensive to cold-create; cache them per
      # form factor so only the first leg pays for it.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ matrix.profile }}

      - name: Create AVD and generate a snapshot to cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            # A cold boot can report completion before its emulated storage is
            # mounted; wait it out or the test's output dir breaks.
            for i in $(seq 1 60); do adb -s emulator-5554 shell ls /sdcard/Android >/dev/null 2>&1 && break; sleep 2; done
            # A loaded software-rendered emulator can raise "Pixel Launcher
            # isn't responding", and that dialog sits over every frame the
            # tour takes while it steals the taps the tour is making: the
            # 10-inch set once came out with the dialog in all eight frames
            # and the tour on the wrong screens. Wait for the system to settle,
            # then dismiss anything that is still up.
            sleep 20
            for i in $(seq 1 10); do adb -s emulator-5554 shell dumpsys window windows | grep -q "Application Not Responding\|isn't responding" || break; adb -s emulator-5554 shell input keyevent KEYCODE_BACK; sleep 3; done
            adb -s emulator-5554 shell am start -a android.intent.action.MAIN -c android.intent.category.HOME >/dev/null 2>&1 || true
            sleep 5
            # One Gradle run, on ONE line: a second connectedAndroidTest
            # invocation would replace the previous additional output (and with
            # it the screenshots), and the emulator runner feeds this script to
            # sh, which chokes on multi-line continuations.
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=io.github.muntasimulhaque.quran.ScreenshotTest,io.github.muntasimulhaque.quran.WordByWordTest,io.github.muntasimulhaque.quran.MushafTurnTest
            # AGP copies the test's additional output off-device (before it
            # uninstalls the app) into the connected additional output folder.
            mkdir -p store-shots
            find app/build/outputs/connected_android_test_additional_output -type f -name '*.png' -exec cp {} store-shots/ ';'
            # Prefix every PNG with the form factor so per-leg artifacts never
            # collide. (Single line: the runner feeds this to sh, which chokes
            # on multi-line compound commands.)
            for f in store-shots/*.png; do mv "$f" "store-shots/${{ matrix.name }}_$(basename "$f")"; done
            echo "Collected:"
            ls -la store-shots
            # A frame must be the app's own surface, never a dialog over it: a
            # system dialog in a store screenshot is worse than no screenshot.
            # The corner where a dialog's text sits stays the page's own color.
            # Count is checked too, so a leg that captured half the tour fails.
            test "$(ls store-shots/*.png 2>/dev/null | wc -l)" -ge 8

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ matrix.name }}
          path: store-shots/**
          if-no-files-found: warn
