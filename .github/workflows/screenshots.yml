name: Capture store screenshots

# Renders real Play Store screenshots from the app's own Compose UI on an
# Android emulator, for all three form factors Play asks for: phone, 7 inch
# tablet, and 10 inch tablet. Trigger manually, or automatically when the UI
# or the capture test changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Play Store form factors.
        include:
          - name: phone
            profile: pixel_2        # 1080x1920
          - name: tablet7
            profile: Nexus 7        # 1200x1920, 7 inch
          - name: tablet10
            profile: pixel_c        # 2560x1800, 10 inch
    env:
      GH_TOKEN: ${{ github.token }}
      API_LEVEL: "35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache content
        uses: actions/cache@v4
        with:
          path: |
            content/work
            content/quran.db
            content/packs
          key: content-work-${{ hashFiles('content/manifest.json', 'content/build-report.json') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            # One Gradle run, on ONE line: a second connectedAndroidTest
            # invocation would replace the previous additional output (and with
            # it the screenshots), and the emulator runner feeds this script to
            # sh, which chokes on multi-line continuations.
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=io.github.muntasimulhaque.quran.ScreenshotTest,io.github.muntasimulhaque.quran.WordByWordTest
            mkdir -p store-shots
            find app/build/outputs/connected_android_test_additional_output -type f -name '*.png' -exec cp {} store-shots/ ';'
            for f in store-shots/*.png; do mv "$f" "store-shots/${{ matrix.name }}_$(basename "$f")"; done
            ls -la store-shots
            test "$(ls store-shots/*.png 2>/dev/null | wc -l)" -ge 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ matrix.name }}
          path: store-shots/**
          if-no-files-found: warn
