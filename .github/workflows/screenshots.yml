name: Capture store screenshots

# Renders real Play Store screenshots from the app's own Compose UI on an
# Android emulator, for all three form factors Play asks for: phone, 7 inch
# tablet, and 10 inch tablet. Trigger manually, or automatically when any
# module that draws the UI changes.
#
# This follows the house screenshot workflow (the family's other apps in
# Documents/GitHub): the Gradle build cache is restored, not just the
# dependency cache, so a fresh runner does not rebuild the whole app; the
# capture build carries only the packs its tests install, so the APK is a
# fraction of the 197 MB a full debug build weighs; and the AVD and its
# snapshot are cached per form factor, so only the first run of a form factor
# pays for creating the machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Every module that can put a pixel on the screen. A UI label lives in
    # its feature's `strings.xml`, and the reading chrome, the sheets, and
    # the shared look are drawn from `ui-kit`, so a change in any of them
    # must recapture: a filter that watched only `app/` would let a settings
    # rename ship a stale store set.
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - "ui-kit/src/main/**"
      - "feature-*/src/main/**"
      - "content-assets/src/main/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Play Store form factors.
        include:
          - name: phone
            profile: pixel_2        # 1080x1920
          - name: tablet7
            profile: Nexus 7        # 1200x1920, 7 inch
          - name: tablet10
            profile: pixel_c        # 2560x1800, 10 inch
    env:
      GH_TOKEN: ${{ github.token }}
      API_LEVEL: "35"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # The build cache, not only the dependency cache: a fresh runner that
      # restores ~/.gradle/caches still recompiles every module, which is most
      # of a cold capture's wall time. This is the house pattern.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache content
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            content/work
            content/quran.db
            content/packs
          key: content-work-${{ hashFiles('content/manifest.json', 'content/build-report.json') }}

      # Hardware acceleration for the emulator on the GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD and its snapshot are expensive to cold-create; cache them per
      # form factor so only the first leg pays for it.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ matrix.profile }}

      - name: Create AVD and generate a snapshot to cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            # A cold boot can report completion before its emulated storage is
            # mounted; wait it out or the test's output dir breaks.
            for i in $(seq 1 60); do adb -s emulator-5554 shell ls /sdcard/Android >/dev/null 2>&1 && break; sleep 2; done
            # ANR and crash dialogs are suppressed at the device level. A
            # loaded software-rendered emulator raises "Pixel Launcher isn't
            # responding" mid-tour on the heaviest leg, and that dialog sits
            # over a frame and steals the taps after it. Dismissing dialogs
            # that are already up cannot win that race; this is the
            # deterministic fix, and it is what makes a red leg a real
            # failure instead of an environment flake. The capture test still
            # checks the window list before keeping a frame, as a second net.
            adb -s emulator-5554 shell settings put global hide_error_dialogs 1
            adb -s emulator-5554 shell settings put secure anr_show_background 0
            # Dismiss anything already up from before that setting landed
            # (bounded, not a fixed sleep).
            for i in $(seq 1 10); do adb -s emulator-5554 shell dumpsys window windows | grep -q "Application Not Responding\|isn't responding" || break; adb -s emulator-5554 shell input keyevent KEYCODE_BACK; sleep 2; done
            adb -s emulator-5554 shell am start -a android.intent.action.MAIN -c android.intent.category.HOME >/dev/null 2>&1 || true
            # One Gradle run: a second connectedAndroidTest invocation would
            # replace the previous additional output, and with it the
            # screenshots, so the three capture classes are named in one call.
            # The lean dev packs carry only what the capture tests install,
            # which keeps the APK small and the install quick. The exit code is
            # kept, and returned at the very end after the frames are
            # collected, so a red leg still leaves its capture in the artifact
            # to be read.
            set +e
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pquran.devPacks=screenshot -Pandroid.testInstrumentationRunnerArguments.class=io.github.muntasimulhaque.quran.ScreenshotTest,io.github.muntasimulhaque.quran.WordByWordTest,io.github.muntasimulhaque.quran.MushafTurnTest
            gradle_status=$?
            set -e
            # AGP copies the test's additional output off-device (before it
            # uninstalls the app) into the connected additional output folder.
            mkdir -p store-shots
            find app/build/outputs/connected_android_test_additional_output -type f -name '*.png' -exec cp {} store-shots/ ';'
            # Prefix every PNG with the form factor so per-leg artifacts never
            # collide. (Single line: the runner feeds this to sh, which chokes
            # on multi-line compound commands.)
            for f in store-shots/*.png; do mv "$f" "store-shots/${{ matrix.name }}_$(basename "$f")"; done
            echo "Collected:"
            ls -la store-shots
            # A frame must be the app's own surface, never a dialog over it: a
            # system dialog in a store screenshot is worse than no screenshot.
            # Count is checked too, so a leg that captured half the tour fails.
            if [ "$(ls store-shots/*.png 2>/dev/null | wc -l)" -lt 8 ]; then echo "the capture is short of the eight frames"; exit 1; fi
            exit $gradle_status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-screenshots-${{ matrix.name }}
          path: store-shots/**
          if-no-files-found: warn
