org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The whole build is configuration-cache clean, so the graph is stored and
# every later run on the same inputs skips configuration entirely. CI caches
# the project .gradle directory so a fresh runner gets the same skip.
org.gradle.configuration-cache=true
kotlin.code.style=official
